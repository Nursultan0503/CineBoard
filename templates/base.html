<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CineBoard{% endblock %}</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: Arial, sans-serif; background: #141414; color: #e5e5e5; }
        a { color: #e50914; }
        .wrap { max-width: 1100px; margin: 0 auto; padding: 0 16px; }
        header { background: #000; padding: 14px 0; border-bottom: 2px solid #e50914; }
        header .wrap { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
        .logo { font-size: 24px; font-weight: bold; color: #e50914; text-decoration: none; }
        nav { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
        nav a { color: #e5e5e5; text-decoration: none; }
        nav a:hover { color: #fff; }
        nav form { margin: 0; }
        main { padding: 28px 0; }
        h1 { margin-top: 0; }
        .btn { display: inline-block; padding: 9px 16px; background: #e50914; color: #fff; border: none; border-radius: 6px;
               text-decoration: none; cursor: pointer; font: inherit; }
        .btn:hover { background: #f6121d; }
        .btn-light { background: #333; }
        .btn-light:hover { background: #444; }
        .btn-link { background: none; border: none; color: #e5e5e5; cursor: pointer; font: inherit; padding: 0; }
        .search { display: flex; gap: 8px; margin: 18px 0; }
        .search input { flex: 1; }
        input, select, textarea { padding: 9px 12px; border-radius: 6px; border: 1px solid #444; background: #222;
                                  color: #e5e5e5; font: inherit; width: 100%; }
        .genres { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 22px; }
        .chip { padding: 5px 12px; border-radius: 16px; background: #2a2a2a; color: #e5e5e5; text-decoration: none; font-size: 14px; }
        .chip.active, .chip:hover { background: #e50914; color: #fff; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 18px; }
        .card { background: #1f1f1f; border-radius: 8px; overflow: hidden; text-decoration: none; color: inherit;
                transition: transform .15s; display: flex; flex-direction: column; }
        .card:hover { transform: scale(1.03); }
        .card img, .no-poster { width: 100%; height: 290px; object-fit: cover; background: #2a2a2a; }
        .no-poster { display: flex; align-items: center; justify-content: center; color: #777; font-size: 40px; }
        .card-body { padding: 12px; }
        .card-body h3 { margin: 0 0 4px; font-size: 16px; }
        .muted { color: #999; font-size: 14px; }
        .detail { display: flex; gap: 28px; flex-wrap: wrap; }
        .detail img, .detail .no-poster { width: 280px; height: 410px; border-radius: 8px; }
        .detail-info { flex: 1; min-width: 260px; }
        .info td { padding: 5px 20px 5px 0; vertical-align: top; }
        .info td:first-child { color: #999; }
        .box { background: #1f1f1f; padding: 20px; border-radius: 8px; margin-top: 24px; }
        .comment { border-top: 1px solid #333; padding: 12px 0; }
        .seats { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0; }
        .seat { padding: 6px 10px; border-radius: 4px; background: #2a5d2a; font-size: 13px; }
        .seat.taken { background: #5d2a2a; text-decoration: line-through; }
        .field { margin-bottom: 14px; }
        .field label { display: block; margin-bottom: 4px; color: #bbb; font-size: 14px; }
        .field ul { list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 18px; }
        .field ul input { width: auto; }
        .helptext, .field .helptext ul { color: #777; font-size: 12px; }
        .errorlist { color: #ff6b6b; font-size: 13px; padding-left: 16px; }
        .form-box { max-width: 560px; margin: 0 auto; }
        .message { padding: 12px 16px; border-radius: 6px; margin-bottom: 16px; background: #1e3a5f; }
        .message.success { background: #1e4d2b; }
        .message.error { background: #5f1e1e; }
        .pagination { display: flex; gap: 6px; justify-content: center; margin-top: 26px; }
        .pagination a, .pagination span { padding: 7px 13px; border-radius: 6px; background: #2a2a2a; color: #e5e5e5; text-decoration: none; }
        .pagination .current { background: #e50914; }
        footer { text-align: center; color: #666; padding: 24px; font-size: 14px; }
    </style>
</head>
<body>
    <header>
        <div class="wrap">
            <a href="{% url 'movie_list' %}" class="logo">🎬 CineBoard</a>
            <nav>
                <a href="{% url 'movie_list' %}">Фильмы</a>
                {% if user.is_authenticated %}
                    <a href="{% url 'movie_create' %}">+ Добавить фильм</a>
                    <a href="{% url 'my_booking' %}">Моя VIP-бронь</a>
                    <span class="muted">{{ user.username }}</span>
                    <form method="post" action="{% url 'logout' %}">
                        {% csrf_token %}
                        <button type="submit" class="btn-link">Выйти</button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}">Войти</a>
                    <a href="{% url 'register' %}" class="btn">Регистрация</a>
                {% endif %}
            </nav>
        </div>
    </header>
    <main class="wrap">
        {% for message in messages %}
            <div class="message {{ message.tags }}">{{ message }}</div>
        {% endfor %}
        {% block content %}{% endblock %}
    </main>
    <footer>CineBoard — контрольная работа по Django</footer>
</body>
</html>
